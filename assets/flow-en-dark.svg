o Sans", Helvetica, Arial, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif' font-size="14.5" font-weight="600" fill="#f0f6fc" text-anchor="middle">Job starts, detached</text><path d="M165 206H381" stroke="#f0f6fc" stroke-width="1.8" fill="none" marker-end="url(#a-fg)"/><rect x="213" y="173" width="127" height="26" rx="6" fill="#212830" stroke="#3d444d"/><text x="277" y="190.6" font-family='ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace' font-size="13.5" font-weight="600" fill="#f0f6fc" text-anchor="middle">handoff leave</text><rect x="385.0" y="186.0" width="230" height="40" rx="10" fill="#0d1117" stroke="#3d444d" stroke-width="1.5"/><text x="500" y="211" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif' font-size="14.5" font-weight="600" fill="#f0f6fc" text-anchor="middle">Watcher starts</text><rect x="55" y="244" width="220" height="286" rx="14" fill="#9198a1" fill-opacity="0.13" stroke="#484f58" stroke-width="1.5" stroke-dasharray="6 6"/><g transform="translate(148,334) scale(1.4166666666666667)" fill="none" stroke="#9198a1" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.2A8.5 8.5 0 1 1 9.8 3.5a6.8 6.8 0 0 0 10.7 10.7z"/></g><text x="165" y="398" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif' font-size="16" font-weight="700" fill="#f0f6fc" text-anchor="middle">Laptop closed</text><text x="165" y="420" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif' font-size="13" font-weight="400" fill="#9198a1" text-anchor="middle">nothing runs here</text><path d="M506 312H829" stroke="#4493f8" stroke-width="1.8" fill="none" stroke-dasharray="5 5" marker-start="url(#