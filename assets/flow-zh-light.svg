, "Segoe UI", "Noto Sans", Helvetica, Arial, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif' font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.08em">第一层 · 交接</text><rect x="363" y="435" width="205" height="22" rx="11" fill="#8250df"/><text x="465.44" y="450.2" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif' font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.08em">第二层 · 唤醒 · 需主动开启</text><rect x="15" y="18" width="300" height="78" rx="14" fill="#ffffff" stroke="#d1d9e0" stroke-width="1.5"/><g transform="translate(94.30000000000001,43) scale(1.1666666666666667)" fill="none" stroke="#0969da" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="11" rx="1.5"/><path d="M2 19.5h20"/></g><text x="134.3" y="53" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif' font-size="17" font-weight="700" fill="#1f2328" text-anchor="start">你的电脑</text><text x="134.3" y="74" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif' font-size="13" font-weight="400" fill="#59636e" text-anchor="start">agent + handoff</text><rect x="350" y="18" width="300" height="78" rx="14" fill="#ffffff" stroke="#d1d9e0" stroke-width="1.5"/><g transform="translate(389.0,43) scale(1.1666666666666667)" fill="none" stroke="#0969da" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="2.8"/></g><text x="429.0" y="53" font-family='-apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK S